name: Trivy Scheduled Scan

on:
  schedule:
    - cron: '0 7 * * 1-5'  # Monday–Friday at 7am UTC
  workflow_dispatch:          # also allows manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  scheduled-scan:
    name: Scheduled Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Run a full scan (all severities, all scanners, JSON output for processing)
      - name: Run full Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build a human-readable markdown report from the JSON
      - name: Build security report
        id: report
        run: |
          VULN_COUNT=$(jq '[.Results[].Vulnerabilities // [] | .[]] | length' trivy-report.json 2>/dev/null || echo 0)
          SECRET_COUNT=$(jq '[.Results[].Secrets // [] | .[]] | length' trivy-report.json 2>/dev/null || echo 0)
          MISCONFIG_COUNT=$(jq '[.Results[].Misconfigurations // [] | .[]] | length' trivy-report.json 2>/dev/null || echo 0)
          TOTAL=$((VULN_COUNT + SECRET_COUNT + MISCONFIG_COUNT))
          DATE=$(date +%Y-%m-%d)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

          mkdir -p security-reports

          cat > security-reports/report-${DATE}.md << EOF
          # 🔒 Trivy Security Report — ${DATE}

          | Category              | Count |
          |-----------------------|-------|
          | Vulnerabilities       | ${VULN_COUNT} |
          | Secrets               | ${SECRET_COUNT} |
          | IaC Misconfigurations | ${MISCONFIG_COUNT} |
          | **Total**             | **${TOTAL}** |

          > Auto-generated by Trivy scheduled scan. Review and address findings below.

          ## Vulnerability Details

          $(jq -r '
            .Results[] |
            select(.Vulnerabilities != null) |
            .Target as $t |
            .Vulnerabilities[] |
            "- **[\(.Severity)]** `\(.VulnerabilityID)` — **\(.PkgName)** \(.InstalledVersion) → fix: \(.FixedVersion // "no fix yet") [\($t)]"
          ' trivy-report.json 2>/dev/null | head -100 || echo "_No vulnerabilities found._")

          ## Secret Findings

          $(jq -r '
            .Results[] |
            select(.Secrets != null) |
            .Target as $t |
            .Secrets[] |
            "- **[\(.Severity)]** \(.Title) in \($t) (line \(.StartLine))"
          ' trivy-report.json 2>/dev/null || echo "_No secrets found._")

          ## IaC Misconfiguration Details

          $(jq -r '
            .Results[] |
            select(.Misconfigurations != null) |
            .Target as $t |
            .Misconfigurations[] |
            "- **[\(.Severity)]** \(.ID) — \(.Title) [\($t)]"
          ' trivy-report.json 2>/dev/null | head -50 || echo "_No misconfigurations found._")
          EOF

      # Only create a PR branch if there are findings
      - name: Create security report PR
        if: steps.report.outputs.total != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=${{ steps.report.outputs.date }}
          BRANCH="trivy/security-report-${DATE}"
          TOTAL=${{ steps.report.outputs.total }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Avoid duplicate branches
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists, skipping."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add security-reports/
          git commit -m "security: Trivy scan report ${DATE} — ${TOTAL} findings"
          git push origin "$BRANCH"

          gh pr create \
            --title "🔒 [Security] ${TOTAL} findings from Trivy scan ${DATE}" \
            --body "$(cat security-reports/report-${DATE}.md)" \
            --base main \
            --head "$BRANCH"

      - name: No findings, no PR
        if: steps.report.outputs.total == '0'
        run: echo "✅ Clean scan on $(date +%Y-%m-%d). No PR created."